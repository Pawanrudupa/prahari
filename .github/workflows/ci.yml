name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prahari
          POSTGRES_PASSWORD: prahari
          POSTGRES_DB: prahari
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prahari"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql+asyncpg://prahari:prahari@localhost:5432/prahari
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_POSTGRES: "true"
      ADMIN_TOKEN: "ci-admin-token-super-secret-key-32chars"
      AUDIT_HMAC_KEY: "ci-audit-checkpoint-hmac-secret-key-32chars"
      SESSION_SECRET_KEY: "ci-session-secret-key-super-secret-32chars"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type-check (mypy)
        run: uv run mypy .
      - name: Run Alembic migrations
        run: uv run alembic upgrade head
      - name: Test (pytest against real Postgres & Redis)
        run: |
          set -o pipefail
          uv run pytest -v --tb=short -rA 2>&1 | tee pytest_report.log || (echo '```' >> $GITHUB_STEP_SUMMARY && cat pytest_report.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && exit 1)
          echo '```' >> $GITHUB_STEP_SUMMARY && cat pytest_report.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY
      - name: "Gateway Latency Benchmark (Target: p95 < 50ms)"
        run: uv run python benchmarks/bench_gateway.py

  web-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          cd ../..
          pnpm install
          pnpm approve-builds esbuild
      - name: Type-check
        run: pnpm type-check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
